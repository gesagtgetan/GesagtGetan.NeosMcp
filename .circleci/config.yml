version: 2.1

orbs:
  php: circleci/php@1.1.0
jobs:
  check:
    docker:
      - image: cimg/php:8.4-node
    steps:
      - checkout
      - php/install-packages:
          install-flags: '--no-interaction --no-ansi --optimize-autoloader --no-progress --prefer-dist'
      - run:
          name: PHP CodeSniffer
          command: vendor/bin/phpcs
      - run:
          name: PHP CS Fixer
          command: vendor/bin/php-cs-fixer check -v
      - run:
          name: PHPStan
          command: vendor/bin/phpstan analyse
      - run:
          name: PHPUnit
          command: vendor/bin/phpunit
  functional-tests:
    docker:
      - image: cimg/php:8.4-node
        environment:
          FLOW_CONTEXT: Testing
          NEOS_MCP_TEST_DB_HOST: 127.0.0.1
          NEOS_MCP_TEST_DB_NAME: neos_mcp_test
          NEOS_MCP_TEST_DB_USER: neos-mcp-user
          NEOS_MCP_TEST_DB_PASSWORD: neos-mcp-pw
      - image: mariadb:11.4
        environment:
          MARIADB_DATABASE: neos_mcp_test
          MARIADB_USER: neos-mcp-user
          MARIADB_PASSWORD: neos-mcp-pw
          MARIADB_ROOT_PASSWORD: root
    steps:
      - checkout
      - run:
          name: Scaffold test distribution
          command: |
            mkdir -p .test-distribution/Configuration/Testing
            cp Tests/TestDistribution/composer.json Tests/TestDistribution/phpunit-functional.xml .test-distribution/
            cp Tests/TestDistribution/Configuration/Testing/Settings.yaml .test-distribution/Configuration/Testing/
      - php/install-packages:
          app-dir: .test-distribution
          # There is no composer.lock in the scaffolded distribution, and the
          # Neos composer plugin installs into Packages/Libraries
          cache-key: composer.json
          vendor-dir: Packages/Libraries
          install-flags: '--no-interaction --no-ansi --no-progress --prefer-dist'
      - run:
          name: Doctrine migrations
          # Creates the Flow/Neos ORM tables (e.g. neos_asset_usage) that the Content
          # Repository's catch-up hooks write to. The CR's own tables are created by the
          # test base class.
          command: cd .test-distribution && ./flow doctrine:migrate --quiet
      - run:
          name: PHPUnit (functional)
          command: cd .test-distribution && php Packages/Libraries/bin/phpunit -c phpunit-functional.xml
workflows:
  check:
    jobs:
      - check
      - functional-tests
