'GesagtGetan.NeosMcp:Testing.Site':
  superTypes:
    'Neos.Neos:Site': true

'GesagtGetan.NeosMcp:Testing.Document':
  superTypes:
    'Neos.Neos:Document': true
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
  properties:
    title:
      type: string
    text:
      type: string

# A document without tethered child nodes, e.g. to change its type to Testing.Document
'GesagtGetan.NeosMcp:Testing.Document.WithoutContent':
  superTypes:
    'Neos.Neos:Document': true
  properties:
    title:
      type: string

'GesagtGetan.NeosMcp:Testing.Content.Text':
  superTypes:
    'Neos.Neos:Content': true
  properties:
    text:
      type: string
